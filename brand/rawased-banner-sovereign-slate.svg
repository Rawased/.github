    <text x="0" y="205" fill="#94A3B8" font-family="IBM Plex Sans, -apple-system, sans-serif" font-size="16.5" font-weight="400">When a quote feed and Note 14 disagree, we show the diff, the Zakat base, the Murabaha stack, and the math.</text>

