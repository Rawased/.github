    <text x="0" y="205" fill="#A1A1AA" font-family="IBM Plex Sans, -apple-system, sans-serif" font-size="16" font-weight="400">Luberef Q3 profit reads SAR 212.00M on a quote feed and SAR 238.45M in Note 14 of the audited Tadawul filing.</text>

